server:
  port: 7091

spring:
  application:
    name: seata-server

logging:
  file:
    path: /root/logs/seata

console:
  user:
    username: seata
    password: seata

seata:
  security:
    secretKey: SeataSecretKeySeataSecretKeySeataSecretKeySeataSecretKey
    tokenValidityInMilliseconds: 1800000
  registry:
    type: nacos
    data-id: seataServer.properties
    nacos:
      application: seata-server
      server-addr: nacos:8848
      group: SEATA_GROUP
      namespace:
      cluster: default
  config:
    type: nacos
    nacos:
      server-addr: nacos:8848
      group: SEATA_GROUP
      namespace:
  store:
    mode: file
